name: APK

# APK de producción. Se lanza a mano desde GitHub → Actions → "APK" → Run workflow, o con:
#   gh workflow run apk.yml                      (usa la variable API_URL del repositorio: el dominio del sistema)
#   gh workflow run apk.yml -f api_url=https://… (otro dominio solo para esta compilación)
# Si el sistema cambia de dominio, las apps instaladas se mudan solas (Configuración → App móvil);
# solo hace falta compilar si el dominio anterior dejó de existir.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Servidor (https://dominio). Vacío = el guardado en la variable API_URL del repositorio.'
        required: false
        default: ''

# contents: write para publicar el release: de ahí el sistema toma versión y enlace de descarga.
permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Validar servidor
        # Se pasa por variable de entorno, nunca interpolado en el script (evita inyección de comandos).
        env:
          API_URL: ${{ inputs.api_url || vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "::error::Define el dominio: variable API_URL del repositorio o el campo al ejecutar"; exit 1; fi
          [[ "$API_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] || { echo "::error::Usa solo https://dominio"; exit 1; }
          echo "API=${API_URL%/}/api/v1" >> "$GITHUB_ENV"

      # Versión: nombre desde pubspec (1.2.0) y número de compilación = el del último release + 1,
      # así cada APK es mayor que la anterior (Android la instala encima y el aviso de actualización la reconoce),
      # aunque el workflow se renombre o se reinicie su contador.
      - name: Versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_ENV"
          ULTIMO=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '[.[].tagName | capture("[+](?<n>[0-9]+)$").n | tonumber] | max // 0')
          echo "BUILD=$(( ULTIMO + 1 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      # Llave fija de firma (secretos del repositorio): sin ella cada APK tendría otra firma
      # y Android no dejaría instalarla encima de la anterior (la actualización fallaría).
      - name: Llave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          CLAVE: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Falta el secreto ANDROID_KEYSTORE: una APK de producción no se firma con la llave de debug"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > android/app/tanta.jks
          printf 'storeFile=tanta.jks\nstorePassword=%s\nkeyAlias=tanta\nkeyPassword=%s\n' "$CLAVE" "$CLAVE" > android/key.properties

      # DIRECTORIO: dirección fija (rama «servidor» de este repositorio) donde el sistema publica su dominio vigente.
      # Si el servidor de la app deja de existir (túnel nuevo, cambio de dominio), la app lo lee ahí y se muda sola.
      - name: Compilar
        env:
          DIRECTORIO: https://raw.githubusercontent.com/${{ github.repository }}/servidor/servidor.json
        run: flutter build apk --release --build-name="$VERSION" --build-number="$BUILD" --dart-define=API_URL="$API" --dart-define=DIRECTORIO="$DIRECTORIO"

      - uses: actions/upload-artifact@v4
        with:
          name: tanta-${{ env.VERSION }}+${{ env.BUILD }}-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Release = aviso de actualización: el sistema lo detecta solo y las apps instaladas lo muestran.
      - name: Publicar release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "tanta-$VERSION+$BUILD.apk"
          gh release create "v$VERSION+$BUILD" "tanta-$VERSION+$BUILD.apk" \
            --title "Tanta $VERSION ($BUILD)" --notes "APK compilada para $API" --target "$GITHUB_SHA"
