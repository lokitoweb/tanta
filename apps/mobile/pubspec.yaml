name: tanta_app
description: "Sistema Integral de Gestión — Panadería Tanta (app móvil)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  flutter_secure_storage: ^11.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  package_info_plus: ^10.2.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
