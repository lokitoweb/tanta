packages:
  - "packages/*"
  - "apps/web"
  - "apps/api"

# pnpm 11 lee la configuración aquí, no en package.json ni en .npmrc
nodeLinker: hoisted
strictPeerDependencies: false
confirmModulesPurge: false
# Únicos paquetes autorizados a ejecutar scripts al instalar (defensa contra cadena de suministro).
allowBuilds:
  esbuild: true
